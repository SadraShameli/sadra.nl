[fmt]
printWidth = 80
singleQuote = true
tabWidth = 4

[fmt.sortTailwindcss]
stylesheet = "./src/styles/styles.css"
functions = []

[lint]
typeAware = true
ignorePatterns = [
    ".claude/worktrees",
    ".next",
    "drizzle",
    "public",
    ".vercel",
    "node_modules",
    "next-env.d.ts",
]
plugins = [
    { name = "@next/next-js", specifier = "@next/eslint-plugin-next" },
    "eslint-plugin-better-tailwindcss",
    "eslint-plugin-drizzle",
    { name = "jsx-a11y-js", specifier = "eslint-plugin-jsx-a11y" },
    "eslint-plugin-perfectionist",
    { name = "promise-js", specifier = "eslint-plugin-promise" },
    { name = "react-hooks-js", specifier = "eslint-plugin-react-hooks" },
    { name = "unicorn-js", specifier = "eslint-plugin-unicorn" },
]

